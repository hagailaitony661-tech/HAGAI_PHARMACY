<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jisajili | HAGAI PHARMACY</title>
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="brand">✚ HAGAI PHARMACY</div>
    <p class="subtitle">PHARMACY MANAGEMENT SYSTEM</p>

    <h1>Fungua Akaunti</h1>
    <p class="description">Chagua aina ya usajili wako.</p>

    <form id="signupForm">

      <label>Aina ya Usajili</label>
      <div>
        <label>
          <input type="radio" name="registrationType" value="main" checked>
          Main Branch — Sajili kampuni mpya
        </label>
        <label>
          <input type="radio" name="registrationType" value="sub">
          Sub Branch — Jiunge na kampuni iliyopo
        </label>
      </div>

      <label>Jina Lako Kamili</label>
      <input type="text" id="fullName" placeholder="Jina lako kamili" required>

      <div id="mainBranchFields">
        <label>Jina la Pharmacy / Kampuni</label>
        <input type="text" id="companyName" placeholder="Mfano: Hagai Pharmacy">

        <label>Namba ya Simu</label>
        <input type="tel" id="phone" placeholder="Mfano: 07XXXXXXXX">

        <label>Anwani ya Kampuni</label>
        <input type="text" id="address" placeholder="Mkoa, Wilaya na eneo">
      </div>

      <div id="subBranchFields" hidden>
        <p class="description">
          Umealikwa kujiunga na kampuni iliyopo. Tumia Invitation Link
          uliyopewa na Owner/Admin, kisha weka Invitation Code.
        </p>

        <label>Invitation Code</label>
        <input type="text" id="invitationCode" placeholder="Weka code uliyopewa">
        <p id="inviteStatus" class="description"></p>
      </div>

      <label>Gmail / Email</label>
      <input type="email" id="email" placeholder="mfano@gmail.com" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Angalau herufi/namba 8" minlength="8" required>

      <label>Thibitisha Password</label>
      <input type="password" id="confirmPassword" placeholder="Rudia password" required>

      <p id="authMessage" class="auth-message"></p>

      <button type="submit">JISAJILI</button>
    </form>

    <p class="bottom-text">
      Tayari una akaunti?
      <a href="login.html">Ingia hapa</a>
    </p>
  </div>

  <footer>© 2026 HAGAI PHARMACY SAAS</footer>
</div>

<script>
const typeInputs = document.querySelectorAll('input[name="registrationType"]');
const mainFields = document.getElementById('mainBranchFields');
const subFields = document.getElementById('subBranchFields');
const companyName = document.getElementById('companyName');
const invitationCode = document.getElementById('invitationCode');
const inviteStatus = document.getElementById('inviteStatus');

const invitationToken = new URLSearchParams(window.location.search).get('invite');

function updateRegistrationFields() {
  const selected = document.querySelector('input[name="registrationType"]:checked').value;
  const isMain = selected === 'main';

  mainFields.hidden = !isMain;
  subFields.hidden = isMain;

  companyName.required = isMain;
  invitationCode.required = !isMain;
}

typeInputs.forEach(input => {
  input.addEventListener('change', updateRegistrationFields);
});

if (invitationToken) {
  document.querySelector('input[name="registrationType"][value="sub"]').checked = true;
  inviteStatus.textContent = 'Invitation Link imepatikana. Weka code uliyopewa na msimamizi.';
}

updateRegistrationFields();
</script>

<script type="module" src="assets/js/auth.js"></script>
</body>
</html>
