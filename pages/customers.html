<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers | HAGAI PHARMACY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fc;font-family:Arial,sans-serif;color:#17243b}
header{background:#fff;padding:18px 25px;border-bottom:1px solid #e5eaf2;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:bold;color:#1769e0}
a{color:#1769e0;text-decoration:none}
main{max-width:1200px;margin:auto;padding:25px}
.top,.toolbar,.actions{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
h1{margin:0 0 7px;font-size:27px}
.sub,small{color:#77849a}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:bold}
.primary{background:#1769e0;color:white}
.secondary{background:#eaf1ff;color:#1769e0}
.danger{background:#ffe9e9;color:#bd2525}
input,textarea{padding:12px;border:1px solid #dce3ee;border-radius:8px;font:inherit;width:100%;background:#fff}
#search{max-width:400px}
.panel,.card{background:#fff;border:1px solid #e5eaf2;border-radius:12px;padding:19px}
.card{margin:22px 0}
.number{font-size:27px;font-weight:bold;margin-top:8px}
.toolbar{margin-bottom:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e5eaf2;font-size:13px}
th{color:#77849a;background:#f8faff}
.notice{display:none;padding:12px;margin:15px 0;border-radius:8px;font-size:13px}
.notice.show{display:block}
.error{background:#ffe9e9;color:#a21e1e}
.success{background:#e8f8ef;color:#176b3b}
.empty{text-align:center;color:#77849a;padding:30px}
.modal{display:none;position:fixed;inset:0;background:#101b2b99;z-index:5;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.dialog{background:white;width:min(600px,100%);max-height:94vh;overflow:auto;border-radius:14px;padding:22px}
.field{margin:14px 0}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
.formbuttons{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
@media(max-width:650px){main{padding:14px}header{padding:14px}.top{align-items:flex-start}}
</style>
</head>
<body>
<header>
 <div class="brand">✚ HAGAI PHARMACY</div>
 <a href="../index.html">← Dashboard</a>
</header>

<main>
 <div class="top">
  <div>
   <h1>Customers Management</h1>
   <div class="sub">Usimamizi wa taarifa za wateja wa kampuni</div>
  </div>
  <button class="primary" id="addBtn">＋ Ongeza Mteja</button>
 </div>

 <div id="notice" class="notice"></div>

 <section class="card">
  <small>JUMLA YA WATEJA</small>
  <div class="number" id="total">0</div>
 </section>

 <section class="panel">
  <div class="toolbar">
   <input id="search" placeholder="Tafuta jina, simu au email...">
   <button class="secondary" id="refreshBtn">↻ Refresh</button>
  </div>
  <div class="tablewrap">
   <table>
    <thead>
     <tr><th>JINA</th><th>SIMU</th><th>EMAIL</th><th>ANUANI</th><th>VITENDO</th></tr>
    </thead>
    <tbody id="rows"></tbody>
   </table>
   <div class="empty" id="empty">Inapakia wateja...</div>
  </div>
 </section>
</main>

<div class="modal" id="modal">
 <div class="dialog">
  <h2 id="formTitle">Ongeza Mteja</h2>
  <form id="customerForm">
   <input type="hidden" name="id">
   <div class="field">
    <label>Jina kamili *</label>
    <input name="full_name" required maxlength="150" placeholder="Jina la mteja">
   </div>
   <div class="field">
    <label>Namba ya simu</label>
    <input name="phone" maxlength="40" placeholder="07XXXXXXXX">
   </div>
   <div class="field">
    <label>Email</label>
    <input name="email" type="email" maxlength="150" placeholder="example@email.com">
   </div>
   <div class="field">
    <label>Anuani</label>
    <textarea name="address" rows="3" maxlength="500" placeholder="Mahali anapoishi mteja"></textarea>
   </div>
   <div class="formbuttons">
    <button type="button" class="secondary" id="cancelBtn">Ghairi</button>
    <button type="submit" class="primary" id="saveBtn">Hifadhi</button>
   </div>
  </form>
 </div>
</div>

<script type="module">
import { dashboardProtection } from '../assets/js/guard.js';
if (!(await dashboardProtection)) throw new Error('Dashboard access denied');

import { supabase } from '../assets/js/supabase.js';

const $ = id => document.getElementById(id);
let membership = null;
let customers = [];

function esc(value) {
 return String(value ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

function notice(message, type='success') {
 $('notice').textContent = message;
 $('notice').className = 'notice show ' + type;
}

function closeForm() {
 $('modal').classList.remove('show');
 $('customerForm').reset();
 $('customerForm').elements.id.value = '';
}

function openForm(customer=null) {
 $('customerForm').reset();
 $('customerForm').elements.id.value = customer?.id || '';
 $('customerForm').elements.full_name.value = customer?.full_name || '';
 $('customerForm').elements.phone.value = customer?.phone || '';
 $('customerForm').elements.email.value = customer?.email || '';
 $('customerForm').elements.address.value = customer?.address || '';
 $('formTitle').textContent = customer ? 'Hariri Taarifa za Mteja' : 'Ongeza Mteja';
 $('modal').classList.add('show');
}

function render() {
 const term = $('search').value.trim().toLowerCase();
 const filtered = customers.filter(c =>
  [c.full_name,c.phone,c.email,c.address]
   .some(v => String(v || '').toLowerCase().includes(term))
 );

 $('total').textContent = customers.length;
 $('rows').innerHTML = filtered.map(c => `
  <tr>
   <td><strong>${esc(c.full_name)}</strong></td>
   <td>${esc(c.phone || '—')}</td>
   <td>${esc(c.email || '—')}</td>
   <td>${esc(c.address || '—')}</td>
   <td>
    <div class="actions">
     <button class="secondary" data-edit="${esc(c.id)}">Hariri</button>
     <button class="danger" data-delete="${esc(c.id)}">Futa</button>
    </div>
   </td>
  </tr>
 `).join('');

 $('empty').style.display = filtered.length ? 'none' : 'block';
 $('empty').textContent = term ? 'Hakuna mteja anayelingana na utafutaji.' : 'Bado hakuna wateja waliosajiliwa.';
}

async function loadCustomers() {
 $('empty').style.display = 'block';
 $('empty').textContent = 'Inapakia wateja...';

 const { data, error } = await supabase
  .from('customers')
  .select('id,full_name,phone,email,address,created_at')
  .eq('company_id', membership.companyId)
  .order('created_at', {ascending:false});

 if (error) throw error;
 customers = data || [];
 render();
}

async function initialize() {
 const {data:{session},error:sessionError} = await supabase.auth.getSession();
 if (sessionError) throw sessionError;

 if (!session) {
  window.location.replace('../login.html');
  return;
 }

 const {data:member,error} = await supabase
  .from('company_members')
  .select('company_id,branch_id,role,membership_scope')
  .eq('user_id',session.user.id)
  .limit(1)
  .maybeSingle();

 if (error) throw error;
 if (!member) throw new Error('Akaunti haina membership ya kampuni.');

 membership = {
  companyId:member.company_id,
  branchId:member.branch_id,
  role:member.role,
  scope:member.membership_scope
 };

 await loadCustomers();
}

$('addBtn').addEventListener('click',()=>openForm());
$('cancelBtn').addEventListener('click',closeForm);
$('refreshBtn').addEventListener('click',async()=>{
 try { await loadCustomers(); notice('Orodha imesasishwa.'); }
 catch(e){notice(e.message,'error');}
});
$('search').addEventListener('input',render);

$('customerForm').addEventListener('submit',async event=>{
 event.preventDefault();
 if (!membership) return;

 const form = event.currentTarget;
 const id = form.elements.id.value;
 const payload = {
  company_id:membership.companyId,
  full_name:form.elements.full_name.value.trim(),
  phone:form.elements.phone.value.trim() || null,
  email:form.elements.email.value.trim() || null,
  address:form.elements.address.value.trim() || null
 };

 if (!payload.full_name) {
  notice('Jaza jina la mteja.','error');
  return;
 }

 $('saveBtn').disabled = true;
 $('saveBtn').textContent = 'Inahifadhi...';

 try {
  let result;
  if (id) {
   result = await supabase.from('customers')
    .update(payload)
    .eq('id',id)
    .eq('company_id',membership.companyId);
  } else {
   result = await supabase.from('customers').insert(payload);
  }

  if (result.error) throw result.error;

  closeForm();
  await loadCustomers();
  notice(id ? 'Taarifa za mteja zimehaririwa.' : 'Mteja amesajiliwa kikamilifu.');
 } catch(e) {
  notice('Imeshindikana kuhifadhi: ' + e.message,'error');
 } finally {
  $('saveBtn').disabled = false;
  $('saveBtn').textContent = 'Hifadhi';
 }
});

$('rows').addEventListener('click',async event=>{
 const editButton = event.target.closest('[data-edit]');
 const deleteButton = event.target.closest('[data-delete]');

 if (editButton) {
  const customer = customers.find(c=>c.id===editButton.dataset.edit);
  if (customer) openForm(customer);
 }

 if (deleteButton) {
  const customer = customers.find(c=>c.id===deleteButton.dataset.delete);
  if (!customer) return;

  if (!confirm('Una uhakika unataka kufuta mteja: ' + customer.full_name + '?')) return;

  try {
   const {error} = await supabase.from('customers')
    .delete()
    .eq('id',customer.id)
    .eq('company_id',membership.companyId);

   if (error) throw error;
   await loadCustomers();
   notice('Mteja amefutwa.');
  } catch(e) {
   notice('Mteja hakuweza kufutwa. Huenda ana miamala inayomtegemea. ' + e.message,'error');
  }
 }
});

initialize().catch(error=>{
 console.error('Customers module:',error);
 notice('Hitilafu: ' + error.message,'error');
 $('empty').textContent = 'Imeshindikana kupakia wateja.';
});
</script>
</body>
</html>
