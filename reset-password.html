<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badilisha Password | HAGAI PHARMACY</title>
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="brand">✚ HAGAI PHARMACY</div>
    <p class="subtitle">PHARMACY MANAGEMENT SYSTEM</p>

    <h1>Badilisha Password</h1>
    <p class="description">
      Weka password yako mpya ili kurejesha akaunti yako.
    </p>

    <form id="resetPasswordForm">
      <label>Password Mpya</label>
      <input type="password" id="newPassword"
        placeholder="Angalau herufi/namba 8"
        minlength="8" required>

      <label>Thibitisha Password Mpya</label>
      <input type="password" id="confirmNewPassword"
        placeholder="Rudia password mpya" required>

      <p id="resetMessage" class="auth-message"></p>

      <button type="submit" id="resetButton" disabled>
        BADILISHA PASSWORD
      </button>
    </form>

    <p class="bottom-text">
      <a href="login.html">Rudi Login</a>
    </p>
  </div>

  <footer>© 2026 HAGAI PHARMACY SAAS</footer>
</div>

<script type="module" src="assets/js/reset-password.js"></script>
</body>
</html>
